<title>Nómina — Acceso restringido · 24/7 Medical Aid</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#b0b4bc;--surface:#c8ccd2;--surface2:#bdc1c8;--border:#8e939b;
  --accent:#1565FF;--accent2:#1e4fc4;--danger:#c62828;
  --text:#0a1d3d;--text2:#1a3563;--text3:#2e4d7d;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(10,29,61,.18);}
.lock{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.lock svg{width:24px;height:24px;stroke:#fff;}
h1{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.2;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text3);margin-bottom:26px;font-family:'DM Mono',monospace;letter-spacing:.03em;}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;font-family:'DM Mono',monospace;}
input{width:100%;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;font-family:'DM Mono',monospace;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s;}
button:hover{background:var(--accent2);}
button:disabled{opacity:.55;cursor:wait;}
.err{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(198,40,40,.12);border:1px solid rgba(198,40,40,.4);color:var(--danger);font-size:13px;}
.back{display:block;text-align:center;margin-top:22px;font-size:13px;color:var(--text3);text-decoration:none;}
.back:hover{color:var(--accent);}
</style>
</head>

  <h1>Calculadora de Nómina</h1>

  }catch(e){

  }
}
document.getElementById('btn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
</body>
