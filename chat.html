<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat — 24/7 Medical Aid</title>
<link rel="manifest" href="/manifest-chat.json">
<meta name="theme-color" content="#04141F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="/apple-touch-icon-chat-180.png">
<link rel="icon" href="/icon-chat-192.png">
<style>
  html,body{margin:0;height:100%;background:#04141F;color:#cfe8f5;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;box-sizing:border-box;text-align:center}
  img.logo{width:92px;height:92px;border-radius:22px}
  h1{font-size:20px;margin:0;color:#fff;font-weight:700}
  p{margin:0;max-width:340px;color:#9fc4d8}
  .btn{appearance:none;border:0;border-radius:12px;background:#17A9DE;color:#04141F;font:700 15px inherit;padding:12px 22px;cursor:pointer;text-decoration:none;display:none}
  .hint{font-size:13px;color:#6f93a6;max-width:340px;display:none}
  b{color:#cfe8f5}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/icon-chat-192.png" alt="Chat">
  <h1>24/7 Medical Aid — Chat</h1>
  <p id="msg">Opening Chat…</p>
  <a class="btn" id="go" href="/?app=1&amp;goto=reloj&amp;solochat=1">Open Chat</a>
  <p class="hint" id="hint">To keep it as a separate app: open your browser menu (⋮) and choose <b>Install app</b> / <b>Add to Home screen</b>. The Chat icon opens straight into your messages.</p>
</div>
<script>
  (function(){
    function go(){ try{ sessionStorage.setItem('tc_solochat','1'); }catch(e){} location.replace('/?app=1&goto=reloj&solochat=1'); }
    var launched = /[?&]app=1/.test(location.search)
      || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches))
      || window.navigator.standalone === true;
    if(launched){ go(); return; }
    // Abierto como pestaña normal (para instalar): mostrar boton + instrucciones, no redirigir solo.
    document.getElementById('msg').textContent = 'Install this as your Chat app, or open it now.';
    var b = document.getElementById('go'); b.style.display = 'inline-block';
    b.addEventListener('click', function(ev){ ev.preventDefault(); go(); });
    document.getElementById('hint').style.display = 'block';
  })();
</script>
</body>
</html>
