<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat — 24/7 Medical Aid</title>
<link rel="manifest" href="/manifest-chat.json">
<meta name="theme-color" content="#04141F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="/apple-touch-icon-chat-180.png">
<link rel="icon" href="/icon-chat-192.png">
<style>
  html,body{margin:0;height:100%;background:#04141F;color:#cfe8f5;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;box-sizing:border-box;text-align:center}
  img.logo{width:92px;height:92px;border-radius:22px}
  h1{font-size:20px;margin:0;color:#fff;font-weight:700}
  p{margin:0;max-width:360px;color:#9fc4d8}
  .btn{appearance:none;border:0;border-radius:12px;background:#17A9DE;color:#04141F;font:700 15px inherit;padding:13px 24px;cursor:pointer;text-decoration:none;display:none}
  .btn2{background:transparent;color:#17A9DE;border:1.5px solid #17A9DE}
  .hint{font-size:13px;color:#6f93a6;max-width:360px;display:none}
  b{color:#cfe8f5}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/icon-chat-192.png" alt="Chat">
  <h1>24/7 Medical Aid — Chat</h1>
  <p id="msg">Add this as your Chat app, or open it now.</p>
  <button class="btn" id="install" type="button">⬇ Install Chat app</button>
  <a class="btn btn2" id="go" href="/?app=1&amp;goto=reloj&amp;solochat=1">Open Chat now</a>
  <p class="hint" id="hint">Open this page in the <b>Chrome browser</b> (not inside the Time Clock app). If the button above doesn't appear, tap Chrome's menu <b>(⋮)</b> → <b>Add to Home screen</b> / <b>Install app</b>.</p>
</div>
<script>
  (function(){
    // Registrar el service worker: Chrome (Android) EXIGE un SW con manejador de
    // fetch para ofrecer "Instalar app" (beforeinstallprompt). Sin esto solo
    // aparecía "Agregar a pantalla de inicio" (acceso directo), no la instalación
    // real de la PWA. Usa el mismo sw.js del portal (scope "/").
    if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
    function go(){ location.replace('/?app=1&goto=reloj&solochat=1'); }
    var launched = /[?&]app=1/.test(location.search)
      || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches))
      || window.navigator.standalone === true;
    if(launched){ go(); return; }   // abierto como app instalada → entra directo al chat

    var openBtn = document.getElementById('go');
    openBtn.style.display = 'inline-block';
    openBtn.addEventListener('click', function(ev){ ev.preventDefault(); go(); });
    document.getElementById('hint').style.display = 'block';

    // Botón de instalación de un toque (Android/Chrome) cuando el navegador lo permite.
    var deferred = null, ib = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault(); deferred = e;
      ib.style.display = 'inline-block';
      document.getElementById('msg').textContent = 'Tap “Install Chat app” to add it to your home screen.';
    });
    ib.addEventListener('click', async function(){
      if(!deferred) return;
      ib.disabled = true; deferred.prompt();
      try{ await deferred.userChoice; }catch(e){}
      deferred = null; ib.style.display = 'none'; ib.disabled = false;
    });
    window.addEventListener('appinstalled', function(){
      ib.style.display = 'none';
      document.getElementById('msg').textContent = 'Installed! Open the Chat icon from your home screen.';
    });
  })();
</script>
</body>
</html>
