<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Time Clock moved — 24/7 Medical Aid</title>
<!-- (24 nov 2026 · Solo 24/7 · Fase 1) El Time Clock ya no vive en github.io.
     Esta página solo manda a https://timeclock.247medical-aid.com (o al Chat), conservando ?invite=, ?reset= y lo demás.
     La app de Windows vieja (?app=win, 1.0.6 o anterior) solo puede abrir github.io: a esa no se la desvía sola
     (abriría el navegador una y otra vez); ve un aviso con el botón. El Monitor la actualiza a la 1.0.8.
     La fuente completa del Time Clock ya no está aquí: ver claude/00-ARQUITECTURA-LEER-PRIMERO.md (§4.1). -->
<script>
(function(){
  var q = location.search || '', h = location.hash || '';
  var chat = /[?&]solochat=1/.test(q);
  var win = /[?&]app=win/.test(q);
  var destino = (chat ? 'https://chat.247medical-aid.com/' : 'https://timeclock.247medical-aid.com/reloj.html') + q + h;
  window.__destino = destino;
  if(!win) location.replace(destino);
})();
</script>
<style>
  html,body{margin:0;min-height:100%;background:#04141F;color:#cfe8f5;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;margin:0 auto;padding:64px 24px;text-align:center}
  h1{font-size:21px;color:#fff;margin:0 0 10px}
  p{margin:0 0 22px;color:#9fc4d8}
  a.btn{display:inline-block;background:#17A9DE;color:#04141F;font-weight:700;text-decoration:none;border-radius:12px;padding:13px 24px}
  a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>The Time Clock has a new address</h1>
  <p id="txt">Opening <b>timeclock.247medical-aid.com</b>…</p>
  <a class="btn" id="ir" href="https://timeclock.247medical-aid.com/">Open the Time Clock</a>
</main>
<script>
  (function(){
    var a = document.getElementById('ir'); if(window.__destino) a.href = window.__destino;
    if(/[?&]app=win/.test(location.search)){
      document.getElementById('txt').innerHTML = 'This Time Clock app is out of date and will update by itself. Until then, use the Time Clock in your browser: <b>timeclock.247medical-aid.com</b>';
      a.href = 'https://timeclock.247medical-aid.com/';
    }
  })();
</script>
</body>
</html>
